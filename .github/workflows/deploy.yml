name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows running this workflow manually from the Actions tab.
  workflow_dispatch:

# Grant GITHUB_TOKEN the permissions required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let one deployment finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Must run before the build: it exposes `base_path`, which the build
      # needs so assets resolve correctly on project pages.
      #
      # This step READS the Pages site, so the site has to exist first. Do not
      # try to automate that away with `enablement: true` on this action —
      # creating a Pages site requires repo-admin rights, and the workflow's
      # GITHUB_TOKEN is an installation token scoped by `permissions:` below.
      # `pages: write` authorises *deploying* to Pages, not *creating* it, so
      # the call fails with "Resource not accessible by integration". Enable
      # Pages once by hand: Settings → Pages → Source → GitHub Actions.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Auto-detected: user sites resolve to "" and project sites to "/<repo>".
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
