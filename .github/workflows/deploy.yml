name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows running this workflow manually from the Actions tab.
  workflow_dispatch:

# Grant GITHUB_TOKEN the permissions required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let one deployment finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Must run before the build: it exposes `base_path`, which the build
      # needs so assets resolve correctly on project pages.
      #
      # `enablement: true` creates the Pages site if it does not exist yet.
      # Without it the step calls GET /repos/{owner}/{repo}/pages against a repo
      # that has never had Pages switched on, gets a 404 and fails the whole
      # run. Enabling it here means a fresh clone of this repo deploys with no
      # manual trip through Settings → Pages.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Auto-detected: user sites resolve to "" and project sites to "/<repo>".
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
