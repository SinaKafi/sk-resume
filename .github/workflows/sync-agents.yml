name: Sync agent docs

# Keeps agents/ in lockstep with src/lib/content.ts. The generated docs carry a
# content hash of their source, so this only produces a commit when the content
# that feeds them actually changed.
on:
  push:
    branches: [main]
    paths:
      - "src/lib/content.ts"
      - "scripts/sync-agents.mjs"
      - "agents/**"
      - ".github/workflows/sync-agents.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-agents
  cancel-in-progress: true

jobs:
  sync:
    name: Regenerate agents/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate agent docs
        run: npm run agents:sync

      - name: Commit if changed
        run: |
          if git diff --quiet -- agents/; then
            echo "Agent docs already up to date — nothing to commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agents/
          git commit -m "chore(agents): sync agent docs from content.ts

          Regenerated by .github/workflows/sync-agents.yml.

          Co-Authored-By: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          git push
